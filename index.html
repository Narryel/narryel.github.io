<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Валентин Афанасьев — Java & Kotlin backend-разработчик. Динамическое резюме: веб-версия и PDF с настраиваемым содержимым.">
    <title>Валентин Афанасьев — Java &amp; Kotlin backend-разработчик</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <div class="container hero-inner">
        <div class="hero-text">
            <div class="hero-hello">Привет! Меня зовут</div>
            <h1 id="heroName" class="hero-name"></h1>
            <div id="heroTitle" class="hero-title"></div>
            <div id="heroMeta" class="hero-meta"></div>
            <p id="heroTagline" class="hero-tagline"></p>
            <div id="heroContacts" class="hero-contacts"></div>
            <div class="hero-actions">
                <button id="myBtn" class="btn btn-primary">Резюме в PDF</button>
            </div>
            <div id="heroStats" class="hero-stats"></div>
        </div>
        <div class="hero-photo">
            <img id="heroAvatar" alt="Валентин Афанасьев" class="avatar">
        </div>
    </div>
</header>

<main class="container page">
    <section id="aboutSection"></section>
    <section id="jobsSection"></section>
    <section id="projectsSection"></section>
    <section id="eduSection"></section>
    <section id="bioSection"></section>
    <section id="hobbySection"></section>
</main>

<footer class="footer">
    <div class="container">
        <div class="footer-note">© <span id="footerYear"></span> · страница и PDF собраны из одного источника данных, без фреймворков</div>
    </div>
</footer>

<!-- The Modal -->
<div id="myModal" class="modal" style="display: none">

    <!-- Modal content -->
    <div class="modal-content">
        <span class="close">&times;</span>
        <p>Что включить в PDF?</p>
        <ul class="modal-options">
            <li><label><input type="checkbox" id="photoCb" checked><span>Фото</span></label></li>
            <li><label><input type="checkbox" id="eduCb" checked><span>Образование</span></label></li>
            <li>
                <div>
                    <label style="display: block"><input type="radio" name="job" value="all" checked><span>Весь опыт работы</span></label>
                    <label style="display: block"><input type="radio" name="job" value="dev"><span>Только опыт работы разработчиком</span></label>
                    <label style="display: block"><input type="radio" name="job" value="last"><span>Только последнее место работы</span></label>
                </div>
            </li>
            <li><label><input type="checkbox" id="projectsCb" checked><span>Проекты</span></label></li>
            <li><label><input type="checkbox" id="bioCb" checked><span>Биография</span></label></li>
            <li><label><input type="checkbox" id="hobbyAndSportCb" checked><span>Хобби</span></label></li>
            <li><label><input type="checkbox" id="pitchCb" checked><span>Обо мне</span></label></li>
        </ul>
        <div class="modal-actions">
            <button id="generatePdfBtn" onclick="makePDF()" class="btn btn-primary">Сохранить</button>
            <button id="openPdfBtn" onclick="openPDF()" class="btn btn-ghost">Открыть в новом окне</button>
        </div>
    </div>
</div>

<!--PDF make-->
<script src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.62/pdfmake.js'></script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.1.62/vfs_fonts.js'></script>

<script src="scripts/const.js"></script>
<script src="scripts/base64.js"></script>
<script src="scripts/main.js"></script>
</body>
</html>
